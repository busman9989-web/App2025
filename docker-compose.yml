version: '3.8'

services:
  web:
    build:
      context: ./packages/web
      dockerfile: Dockerfile
    container_name: carerconnect-web
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
    networks:
      - carerconnect_net
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ./packages/api
      dockerfile: Dockerfile
    container_name: carerconnect-api
    ports:
      - "3000:3000"
    env_file:
      - ./packages/api/.env
    networks:
      - carerconnect_net
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:14-alpine
    container_name: carerconnect-db
    ports:
      - "5432:5432"
    environment:
      # Securely loads credentials from your .env file
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # This line persists the database data
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # Ensures the API waits until the DB is ready
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - carerconnect_net
    restart: unless-stopped

  redis:
    image: redis:6-alpine
    container_name: carerconnect-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    networks:
      - carerconnect_net
    restart: unless-stopped

volumes:
  db_data:

networks:
  carerconnect_net:
    driver: bridge